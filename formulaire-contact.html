<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Contact | BATI-CA FRANCE</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
    :root {
        --primary: #171818;
        --bronze: #B07D62;
        --border: #c4c7c7;
        --bg: #fbf9f9;
    }
    body {
        margin: 0;
        background: var(--bg);
        font-family: 'Manrope', sans-serif;
        color: var(--primary);
        display: flex;
        justify-content: center;
        padding: 60px 20px;
    }
    form {
        width: 100%;
        max-width: 560px;
        background: #ffffff;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0px 10px 30px rgba(0,0,0,0.06);
    }
    h1 {
        font-family: 'Playfair Display', serif;
        font-size: 28px;
        margin: 0 0 8px;
    }
    p.intro {
        margin: 0 0 32px;
        color: #5e5e5b;
    }
    label {
        display: block;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: #5e5e5b;
        margin-bottom: 6px;
    }
    .field {
        margin-bottom: 22px;
    }
    input[type="text"],
    input[type="email"],
    input[type="tel"],
    textarea {
        width: 100%;
        box-sizing: border-box;
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-family: inherit;
        font-size: 15px;
        background: #fbf9f9;
    }
    input:focus, textarea:focus {
        outline: none;
        border-color: var(--primary);
    }
    textarea {
        resize: vertical;
        min-height: 120px;
    }
    input[type="file"] {
        width: 100%;
        font-size: 14px;
    }
    .hint {
        font-size: 12px;
        color: #8a8a87;
        margin-top: 6px;
    }
    button {
        width: 100%;
        background: var(--primary);
        color: #ffffff;
        border: none;
        padding: 16px;
        border-radius: 8px;
        font-family: inherit;
        font-weight: 600;
        font-size: 14px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        cursor: pointer;
        transition: background 0.3s ease;
    }
    button:hover {
        background: var(--bronze);
    }
    .success, .error {
        display: none;
        margin-top: 16px;
        padding: 14px;
        border-radius: 8px;
        font-size: 14px;
    }
    .success { background: #e6f4ea; color: #1e4620; }
    .error { background: #fde8e8; color: #7a1212; }
</style>
</head>
<body>

<form id="contact-form" action="https://formspree.io/f/xnjelwvq" method="POST" enctype="multipart/form-data">

    <h1>Parlons de votre projet</h1>
    <p class="intro">Remplissez ce formulaire, nous vous répondons sous 24h.</p>

    <div class="field">
        <label for="nom">Nom complet *</label>
        <input type="text" id="nom" name="Nom complet" required/>
    </div>

    <div class="field">
        <label for="email">Adresse e-mail *</label>
        <input type="email" id="email" name="_replyto" required/>
    </div>

    <div class="field">
        <label for="telephone">Téléphone *</label>
        <input type="tel" id="telephone" name="Téléphone" required/>
    </div>

    <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="Message" placeholder="Décrivez votre projet..."></textarea>
    </div>

    <div class="field">
        <label for="fichier">Joindre un fichier (photo, plan, devis...)</label>
        <input type="file" id="fichier" name="Pièce jointe"/>
        <p class="hint">Formats acceptés : PDF, JPG, PNG — 10 Mo maximum.</p>
    </div>

    <!-- Champ anti-spam invisible (piège à robots) -->
    <input type="text" name="_gotcha" style="display:none" tabindex="-1" autocomplete="off"/>

    <!-- Objet de l'e-mail reçu -->
    <input type="hidden" name="_subject" value="Nouvelle demande de contact - BATI-CA FRANCE"/>

    <button type="submit">Envoyer ma demande</button>

    <div class="success" id="form-success">Merci, votre message a bien été envoyé !</div>
    <div class="error" id="form-error">Une erreur est survenue, merci de réessayer ou de nous appeler directement.</div>
</form>

<script>
    const form = document.getElementById('contact-form');
    const success = document.getElementById('form-success');
    const error = document.getElementById('form-error');

    form.addEventListener('submit', function (e) {
        e.preventDefault();
        success.style.display = 'none';
        error.style.display = 'none';

        fetch(form.action, {
            method: 'POST',
            body: new FormData(form),
            headers: { 'Accept': 'application/json' }
        }).then(response => {
            if (response.ok) {
                success.style.display = 'block';
                form.reset();
            } else {
                error.style.display = 'block';
            }
        }).catch(() => {
            error.style.display = 'block';
        });
    });
</script>

</body>
</html>
